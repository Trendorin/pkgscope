name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't post details of security problems here, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The file you inspected
      description: Its format and where it comes from (a link if it is public). Attach it only if it is not private.
  - type: input
    id: version
    attributes:
      label: PkgScope version and how you installed it
      placeholder: e.g. 1.1.1, Arch package / AppImage
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and kernel
      placeholder: e.g. Debian 13, Linux 6.12
    validations:
      required: true
  - type: textarea
    id: sandbox
    attributes:
      label: Sandbox check
      description: For tracing problems, the output of Analyze → Check sandbox support.
      render: text
