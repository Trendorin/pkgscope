name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could PkgScope help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Package formats, Rules and findings, Sandbox and tracing, Reports, Window, Command line, Installation, Other]
