name: Release

# A pushed tag vX.Y.Z builds every package, installs and runs each one on its own
# distribution, and publishes them with SHA256SUMS. Run it by hand to get the same
# files as workflow artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^project(PkgScope VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $version in CMakeLists.txt"; exit 1
          fi
          grep -qx "pkgver=$version" packaging/arch/PKGBUILD
          grep -Eq "^Version: +$version$" packaging/rpm/pkgscope.spec
          grep -q "^## \[$version\]" CHANGELOG.md

      - name: Archive
        run: |
          mkdir dist
          v=${{ steps.version.outputs.version }}
          git archive --format=tar.gz --prefix="pkgscope-$v/" -o "dist/pkgscope-$v.tar.gz" HEAD

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: dist/*

  arch:
    name: Arch Linux package
    needs: source
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Build dependencies
        run: pacman -Syu --noconfirm --needed cmake ninja qt6-base libarchive strace squashfs-tools

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder: .
          cd packaging/arch
          runuser -u builder -- makepkg --noconfirm --cleanbuild
          mkdir -p ../../dist
          mv ./*.pkg.tar.zst ../../dist/

      - name: Install and run
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          pacman -Qkk pkgscope
          pkgscope-cli --version
          QT_QPA_PLATFORM=offscreen pkgscope --version
          test -x /usr/lib/pkgscope/pkgscope-sandbox

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  debian:
    name: Debian package
    needs: source
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build dpkg-dev \
            qt6-base-dev libarchive-dev

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: packaging/deb/build.sh

      - name: Install and run
        run: |
          apt-get install -y ./dist/pkgscope_*.deb
          dpkg -s pkgscope | grep -E '^(Version|Depends):'
          pkgscope-cli --version
          QT_QPA_PLATFORM=offscreen pkgscope --version
          test -x /usr/libexec/pkgscope/pkgscope-sandbox

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian
          path: dist/*.deb

  fedora:
    name: Fedora package
    needs: source
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Build dependencies
        run: dnf install -y --setopt=install_weak_deps=False rpm-build cmake ninja-build gcc-c++ qt6-qtbase-devel libarchive-devel

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source
          path: dist

      - name: Build
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          cp dist/pkgscope-*.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -bb packaging/rpm/pkgscope.spec
          rm dist/*
          cp ~/rpmbuild/RPMS/x86_64/pkgscope-[0-9]*.rpm dist/

      - name: Install and run
        run: |
          dnf install -y ./dist/pkgscope-*.rpm
          rpm -V pkgscope
          pkgscope-cli --version
          QT_QPA_PLATFORM=offscreen pkgscope --version
          test -x /usr/libexec/pkgscope/pkgscope-sandbox

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fedora
          path: dist/*.rpm

  appimage:
    name: AppImage
    needs: source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build dependencies and Qt
        run: packaging/appimage/build.sh --deps

      - name: Build
        run: packaging/appimage/build.sh

      - name: Run
        shell: bash   # -eo pipefail: a failing command before | tee fails the step
        run: |
          sudo apt-get install -yq xvfb
          img=$(ls dist/*.AppImage)
          "$img" --appimage-extract-and-run --cli --version
          xvfb-run -a "$img" --appimage-extract-and-run --version
          "$img" --appimage-extract >/dev/null
          test -f squashfs-root/usr/plugins/wayland-shell-integration/libxdg-shell.so
          test -f squashfs-root/usr/plugins/platforms/libqwayland-generic.so
          test -z "$(find squashfs-root -type f -perm /022)"
          # The bundled helpers work without strace or squashfs-tools on the host.
          sudo apt-get remove -yq strace squashfs-tools || true
          squashfs-root/usr/bin/strace -V
          (squashfs-root/usr/bin/unsquashfs -v 2>&1 || true) | grep 'unsquashfs version'   # -v exits with 1
          "$img" --appimage-extract-and-run --cli "$img" | tee inspect.txt
          awk '/entries:/ { n = $2 + 0 } END { exit !(n > 50) }' inspect.txt
          ! grep -E '\[(Critical|High)' inspect.txt   # PkgScope must not flag itself
          printf '#!/bin/sh\necho hi > /etc/pkgscope-ci-test\n' > trace-me.sh
          "$img" --appimage-extract-and-run --cli --trace --timeout 30 trace-me.sh | tee trace.txt
          grep -q 'runtime: 1 processes, 1 fs changes' trace.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage
          path: dist/*.AppImage

  publish:
    name: Publish
    needs: [source, arch, debian, fedora, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: .github/release-notes.sh "${{ needs.source.outputs.version }}" > notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref_type != 'tag'
        with:
          name: release
          path: |
            dist/*
            notes.md

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "PkgScope ${{ needs.source.outputs.version }}" --notes-file notes.md
